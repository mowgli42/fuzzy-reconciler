name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[test]"
      - name: Import samples + regional canonical fixtures
        run: |
          make import-samples
          # Canonical Iran pair is committed; regenerate if missing
          test -f fixtures/regions/canonical/iran_pair.json || make fixtures-regions-canonical
      - name: Pytest
        run: |
          PYTHONPATH=src .venv/bin/pytest -q
